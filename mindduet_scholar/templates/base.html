<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MindDuet Scholar{% endblock %}</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/">MindDuet <span>Scholar</span></a>
        <nav aria-label="Main navigation">
          <a href="/">Today</a>
          <a href="/library">Library</a>
          <a href="/english">IELTS</a>
          <a href="/sessions">Sessions</a>
          <a href="/reports">Reports</a>
        </nav>
        <a class="new-session" href="/sessions/new">New session</a>
      </div>
    </header>
    <main class="page-shell">
      {% if request.query_params.get('notice') %}
      <p class="notice">{{ request.query_params.get('notice') }}</p>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
